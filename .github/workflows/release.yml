name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm publish --provenance via OIDC

# One publish at a time; a second tag queue behind the running publish
# instead of racing it on the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Full npm test inside (see the `test` job in ci.yml) plus a publish; same
    # hang-vs-6-hour-default reasoning.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same seam-probe checkout as ci.yml, and for the same reason: since the
      # gate started FAILING LOUD when integration-check has no checkout to read,
      # a release without one dies at `npm test` — which is how v1.25.0's first
      # Release run failed (the tag and the commit were fine; the job was missing
      # the pinned sources). The ref is the release this plugin is verified
      # against (docs/COMPAT.md); nothing is installed or built in it.
      - name: Check out the pinned dsh checkout (seam probe)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.7-rc.2
          path: .dsh-checkout
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run self-check + host-check
        env:
          DSH_CHECKOUT: ${{ github.workspace }}/.dsh-checkout
          # Same self-annotating gate as ci.yml (see scripts/lib/ci-failure-annotation.mjs):
          # a publish that dies must say which check died.
          NODE_OPTIONS: --import=./scripts/lib/ci-failure-annotation.mjs
        run: npm test

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
