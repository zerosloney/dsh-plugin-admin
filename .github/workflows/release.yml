name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm publish --provenance via OIDC

# One publish at a time; a second tag queue behind the running publish
# instead of racing it on the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Full npm test inside (see the `test` job in ci.yml) plus a publish; same
    # hang-vs-6-hour-default reasoning.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same seam-probe checkout as ci.yml, and for the same reason: since the
      # gate started FAILING LOUD when integration-check has no checkout to read,
      # a release without one dies at `npm test` — which is how v1.25.0's first
      # Release run failed (the tag and the commit were fine; the job was missing
      # the pinned sources). The ref is the release this plugin is verified
      # against (docs/COMPAT.md); nothing is installed or built in it.
      - name: Check out the pinned dsh checkout (seam probe)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.7-rc.2
          path: .dsh-checkout
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run self-check + host-check
        env:
          DSH_CHECKOUT: ${{ github.workspace }}/.dsh-checkout
          # Same self-annotating gate as ci.yml (see scripts/lib/ci-failure-annotation.mjs):
          # a publish that dies must say which check died.
          NODE_OPTIONS: --import=./scripts/lib/ci-failure-annotation.mjs
        run: npm test

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The only check that exercises the artifact npm users actually receive.
  # Every path-based gate reads the checkout, so a files-whitelist gap
  # ("docs/ left the tarball", v1.26.x) ships green; installing the just-
  # published version from the registry into a throwaway profile is the only
  # way to catch it at the pipeline instead of a user's bug report. No
  # browser: the smoke's browser section skips when none is required.
  smoke-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Same pinned toolchain as the host-smoke job in ci.yml: the real Host
      # under test, and pnpm because `dsh plugin add` materialises the
      # profile with it. The smoke script itself has zero npm dependencies.
      - name: Install the pinned dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.1.7-rc.2

      - name: Install pnpm (dsh's profile installer)
        run: npm install --global pnpm@11

      # The registry serves the new version a few seconds after publish;
      # poll instead of a blind sleep, with a hard 5-minute ceiling so a
      # genuinely missing publish fails loud rather than hanging.
      - name: Wait for the registry to serve the published version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if npm view "dsh-plugin-admin@${VERSION}" version >/dev/null 2>&1; then
              echo "registry serves dsh-plugin-admin@${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::registry never served dsh-plugin-admin@${VERSION} within 5 minutes"
          exit 1

      - name: Smoke the published package (registry install)
        # The smoke script inherits the environment minus NODE_OPTIONS itself.
        run: |
          export SMOKE_PACKAGE_SPEC="dsh-plugin-admin@${GITHUB_REF_NAME#v}"
          npm run smoke:real-host
