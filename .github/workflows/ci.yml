name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Superseded pushes cancel in-flight runs: the newest commit's result is the
# only one that matters for the merge gate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        # The plugin only ever runs inside dsh, whose own floor is node >=24.9.0
        # (deepseek-harness root package.json engines.node). A Node 22 lane would
        # test a combination no user can have.
        node: [24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # npm test is 8-15 min on a 2-core runner; 30 min is double headroom. The
    # inner waits (cron minute-boundary polls, the real-host boot budget) only
    # bound the path they know about — a hang must cost half an hour, not the
    # 6-hour GitHub default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The seam probe (integration-check) reads dsh's TypeScript SOURCES, so it
      # needs a checkout to read: without one it skips, and a skipped gate
      # reports exactly the same green as an enforced one — which is how
      # upstream drift reaches a release unnoticed. The ref is the release this
      # plugin is verified against (docs/COMPAT.md); the repository is public,
      # so the default token suffices. Nothing is installed or built in it.
      - name: Check out the pinned dsh checkout (seam probe)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.2
          path: .dsh-checkout
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the gate (tsc / lint / artifact check / the verify chain — step table in scripts/run-gate.mjs)
        env:
          DSH_CHECKOUT: ${{ github.workspace }}/.dsh-checkout
          # Makes a failing verify script annotate itself (name + assertion tail).
          # Annotations are public on a public repo; the job log is not — see
          # scripts/lib/ci-failure-annotation.mjs.
          NODE_OPTIONS: --import=./scripts/lib/ci-failure-annotation.mjs
        run: npm test

  # The only job that boots a REAL Host. Everything else mounts the plugin against
  # a fake ctx (host-check), a jsdom shell (self-check) or reads dsh sources
  # (integration-check) — none of those can catch "the loader composes our row but
  # the service never mounts", "the client bundle is not in the module table", or
  # "the gateway rejects our descriptors". Runs on one OS only: it is a smoke
  # check, not a portability matrix, and each run installs a pinned dsh globally.
  host-smoke:
    runs-on: ubuntu-latest
    # The smoke itself is ~30s once dsh + pnpm are installed; the outer bound
    # covers the global installs and any hang (same reasoning as `test`).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Pinned to the release this plugin is verified against (docs/COMPAT.md).
      - name: Install the pinned dsh CLI
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.2

      # `dsh plugin … add` materialises the profile with pnpm, which the runner
      # does not ship: without it the install step dies with exit 127.
      - name: Install pnpm (dsh's profile installer)
        run: npm install --global pnpm@11

      - name: Install dependencies
        run: npm ci

      - name: Boot a real Host and exercise one RPC
        env:
          # A missing CLI here is a broken pipeline, not an opt-out.
          SMOKE_REQUIRE_DSH: '1'
          # ubuntu runners ship Chrome; require it so the browser half of the
          # smoke cannot silently skip in CI.
          SMOKE_REQUIRE_BROWSER: '1'
          # NOTE: no NODE_OPTIONS preload here — the script emits its own
          # `::error::` annotations, and inheriting the preload would run it inside
          # dsh/pnpm and pollute the output the script reports on failure.
        run: npm run smoke:real-host

      # N-16: the OTHER deployment shape. smoke:real-host boots the full web
      # profile, where every seam exists — so it can never falsify the README
      # claim "缺服务逐面板降级". sdk-minimal is the bundle that genuinely lacks
      # typert / subagents / commands / shell (its patch header: "this insert is
      # the complete Cordis tree"), and v1.29.0's `inject=[]` regression was
      # invisible to all 45 self-built gates while breaking the whole RPC surface
      # on a real host. This step is that missing layer, and it carries a
      # positive control: a deliberately broken row must be REPORTED on the same
      # bundle, otherwise "no output" would not prove our row activated.
      - name: Mount on a degraded host (sdk-minimal, missing seams)
        env:
          SMOKE_REQUIRE_DSH: '1'
        run: npm run smoke:degraded-host

  # The multi-version matrix runs the same probe over several checkouts, so
  # "supported dsh versions" is a loop over directories instead of a promise in
  # a doc. It needs no dependencies of its own (integration-check only reads
  # TypeScript sources), so this job is two shallow checkouts plus one node run.
  # `dsh master` is the early-warning row: routine upstream refactors are
  # expected to pass, a contract change must trip here first. This copy runs
  # only when THIS repo has activity; seam-early-warning.yml schedules the
  # same probe daily so drift is caught even while the repo is quiet.
  seam-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check out the pinned dsh release (verification baseline)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.2
          path: .dsh-release
          fetch-depth: 1

      # The declared SUPPORT FLOOR (docs/COMPAT.md: dsh ≥ 0.1.7-rc.2). Kept in
      # the matrix as a regression sentinel: the baseline proves the plugin
      # works on the version users are on now, this row proves it still works
      # on the oldest version it PROMISES to support. Drop it only when the
      # floor itself moves.
      - name: Check out the support floor (dsh 0.1.7-rc.2)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.7-rc.2
          path: .dsh-floor
          fetch-depth: 1

      - name: Check out dsh master (early warning)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: .dsh-main
          fetch-depth: 1

      - name: Probe every checkout
        env:
          # An explicit list makes "nothing to probe" a failure, so a typo here
          # cannot pass as a green matrix (see scripts/check-matrix.mjs).
          DSH_CHECKOUTS: ${{ github.workspace }}/.dsh-release,${{ github.workspace }}/.dsh-floor,${{ github.workspace }}/.dsh-main
          # The `master` row is an EARLY WARNING, not a gate: routine upstream
          # refactors are expected to pass, but churn there must not turn this
          # job red — a permanently red gate is not a gate (v1.29.0 audit's own
          # lesson). Its drift is reported and annotated, while the baseline and
          # the support floor still decide pass/fail.
          DSH_EARLY_WARNING: .dsh-main
        run: npm run test:matrix
